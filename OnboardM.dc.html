      <sc-if value="{{wrong}}" hint-placeholder-val="{{ false }}"><span style="color:#8D8E92">다시 한 번.</span></sc-if>
    </div>
    <label style="position:relative;display:grid;grid-template-columns:repeat(4, minmax(0, 1fr));gap:10px;cursor:text">
      <sc-for list="{{slots}}" as="s" hint-placeholder-count="4">
        <span style="{{s.style}}">{{s.ch}}</span>
      </sc-for>
      <input aria-label="네 자리 입력" inputmode="numeric" autocomplete="off" value="{{v}}" onChange="{{onType}}" style="position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;padding:0;cursor:text">
    </label>
  </div>

  <svg style="position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;z-index:6" width="390" height="844" aria-hidden="true">
    <filter id="grainOM"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"></feTurbulence><feColorMatrix type="matrix" values="0 0 0 0 0.3  0 0 0 0 0.3  0 0 0 0 0.32  0.7 0 0 0 -0.4"></feColorMatrix></filter>
    <rect width="390" height="844" filter="url(#grainOM)" opacity="0.45"></rect>
  </svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { v: '' }; }
  renderVals() {
    const v = this.state.v;
    const ok = v === '1203';
    const wrong = v.length === 4 && !ok;
    const rot = [0, 0, -3, 2, 6];
    const st = (i) => {
      const shown = v.length >= i;
      const base = '--r:' + rot[i] + 'deg;';
      if (wrong) return base + 'animation:away .7s cubic-bezier(.5,0,.9,.5) both';
      return shown ? base + 'animation:land 1.4s both' : base + 'transform:translateY(-1000px) rotate(' + rot[i] + 'deg)';
    };
    const slots = [0,1,2,3].map((i) => {
      const ch = v[i] || '';
      const cur = i === v.length;
      const base = 'height:72px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-family:Nanum Gothic Coding,monospace;font-size:24px;';
      const look = ch ? 'background:#ECEBE7;color:#1D1E21;border:2px solid #ECEBE7;' : (cur ? 'background:#1D1E21;color:#ECEBE7;border:3px solid #2A4BA0;' : 'background:#1D1E21;color:#8D8E92;border:2px solid #6A6B70;');
      return { ch: ch || '[ ]', style: base + look };
    });
    return {
      v, slots, ok, wrong,
      s1: st(1), s2: st(2), s3: st(3), s4: st(4),
      onType: (e) => { const nv = String(e.target.value || '').replace(/\D/g, '').slice(0, 4); this.setState({ v: nv }); if (nv === '1203') { try { localStorage.setItem('sea:unlocked', '1'); } catch (e) {} } if (nv === '1203') setTimeout(() => { const a = document.getElementById('goLetter'); if (a) a.click(); }, 2600); }
    };
  }
}
</script>
</body>
</html>
